# Active profile for tests (enables TestSecurityConfig)
spring.profiles.active=test

# Allow bean definition overriding for test configurations
spring.main.allow-bean-definition-overriding=true

# Disable Spring Cloud Config and Consul for tests
spring.config.import=optional:none
spring.cloud.config.enabled=false
spring.cloud.consul.enabled=false
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.enabled=false

# Test Database configuration (H2 for unit tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS accounts
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-mode=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_new_id_generator_mappings=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Disable scheduling in tests
spring.scheduling.enabled=false

# H2 console (optional, for debugging)
spring.h2.console.enabled=false
