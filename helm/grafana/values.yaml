# Grafana Helm Chart Values

image:
  repository: grafana/grafana
  tag: "10.0.0"
  pullPolicy: IfNotPresent

# Admin credentials (should be moved to secrets in production)
adminUser: admin
adminPassword: admin

# Service configuration
service:
  type: NodePort
  port: 3000
  nodePort: 30030
  annotations: {}

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Persistence for dashboards and datasources
persistence:
  enabled: false
  size: 2Gi
  storageClassName: ""

# Prometheus datasource
datasources:
  prometheus:
    name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true

# Dashboard providers
dashboards:
  enabled: true
  searchPath: /var/lib/grafana/dashboards

# Additional environment variables
env:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
  GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
  GF_SERVER_ROOT_URL: http://localhost:30030
  GF_AUTH_ANONYMOUS_ENABLED: "false"
