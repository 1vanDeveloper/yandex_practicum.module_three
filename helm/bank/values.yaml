# Глобальные настройки для всех сервисов
global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  
  # PostgreSQL
  postgresql:
    host: "postgresql"
    port: 5432
    database: "bank"
    username: "user"
    password: "password"
  
  # Keycloak
  keycloak:
    url: "http://keycloak:8080"
    realm: "bank"

  # Zipkin
  zipkin:
    url: "http://zipkin:9411"

  # JWT Secret (должен совпадать во всех сервисах)
  jwtSecret: "mySecretKeyForJWTTokenGenerationMustBeLongEnough"

# Включение/выключение сервисов
prometheus:
  enabled: true

grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin

zipkin:
  enabled: true

kafka:
  enabled: true

elasticsearch:
  enabled: true

logstash:
  enabled: true

kibana:
  enabled: true

# Настройки для каждого сервиса переопределяются в его values.yaml
