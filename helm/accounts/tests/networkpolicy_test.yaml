suite: Accounts NetworkPolicy Tests
templates:
  - networkpolicy.yaml
tests:
  - it: should create NetworkPolicy with correct name
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-accounts

  - it: should select correct pods
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: accounts
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should allow ingress from gateway
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: gateway
                app.kubernetes.io/instance: RELEASE-NAME

  - it: should allow ingress from cash
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: cash
                app.kubernetes.io/instance: RELEASE-NAME

  - it: should allow ingress from transfer
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: transfer
                app.kubernetes.io/instance: RELEASE-NAME

  - it: should allow ingress on port 8080
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP

  - it: should allow egress to PostgreSQL
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: postgresql
                    app.kubernetes.io/instance: RELEASE-NAME
            ports:
              - port: 5432
                protocol: TCP

  - it: should allow egress to Keycloak
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: keycloak
                    app.kubernetes.io/instance: RELEASE-NAME
            ports:
              - port: 8080
                protocol: TCP

  - it: should allow egress to Kafka
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
                    app.kubernetes.io/instance: RELEASE-NAME
                  component: broker
            ports:
              - port: 9092
                protocol: TCP

  - it: should allow DNS egress
    asserts:
      - equal:
          path: spec.egress[0].ports
          value:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  - it: should have both Ingress and Egress policy types
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress
