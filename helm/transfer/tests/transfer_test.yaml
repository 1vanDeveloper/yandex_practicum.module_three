suite: Transfer Service Deployment Tests
templates:
  - deployment.yaml
tests:
  - it: should create deployment with correct name
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-transfer
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: transfer
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should use correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "bank-transfer:latest"

  - it: should configure probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /actuator/health/liveness
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /actuator/health/readiness
---
suite: Transfer Service Tests
templates:
  - service.yaml
tests:
  - it: should create service with correct name
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-transfer
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: transfer
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
---
suite: Transfer NetworkPolicy Tests
templates:
  - networkpolicy.yaml
tests:
  - it: should create NetworkPolicy with correct name
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-transfer

  - it: should allow ingress from gateway
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: gateway
                app.kubernetes.io/instance: RELEASE-NAME

  - it: should allow egress to accounts and cash
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: accounts
                    app.kubernetes.io/instance: RELEASE-NAME
            ports:
              - port: 8080
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: cash
                    app.kubernetes.io/instance: RELEASE-NAME
            ports:
              - port: 8080
                protocol: TCP
