apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_APPLICATION_NAME: "{{ .Chart.Name }}"
  # Explicit routes for services (using direct Kubernetes DNS since discovery is disabled)
  SPRING_CLOUD_GATEWAY_ROUTES_0_ID: accounts
  SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://accounts.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/accounts/**
  SPRING_CLOUD_GATEWAY_ROUTES_1_ID: auth
  SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://accounts.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/gateway/auth/**
  SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0: StripPrefix=1
  SPRING_CLOUD_GATEWAY_ROUTES_2_ID: api-auth
  SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://accounts.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/auth/**
  SPRING_CLOUD_GATEWAY_ROUTES_2_FILTERS_0: StripPrefix=1
  SPRING_CLOUD_GATEWAY_ROUTES_3_ID: cash
  SPRING_CLOUD_GATEWAY_ROUTES_3_URI: "http://cash.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/cash/**
  SPRING_CLOUD_GATEWAY_ROUTES_4_ID: transfer
  SPRING_CLOUD_GATEWAY_ROUTES_4_URI: "http://transfer.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/transfer/**
  SPRING_CLOUD_GATEWAY_ROUTES_5_ID: notifications
  SPRING_CLOUD_GATEWAY_ROUTES_5_URI: "http://notifications.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/notifications/**
  SPRING_CLOUD_GATEWAY_ROUTES_6_ID: frontend
  SPRING_CLOUD_GATEWAY_ROUTES_6_URI: "http://frontend.default.svc.cluster.local:8080"
  SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: Path=/frontend/**
  # OAuth2 Client Configuration (non-sensitive)
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GATEWAY_SERVICE_CLIENT_ID: "{{ .Chart.Name }}-client"
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GATEWAY_SERVICE_AUTHORIZATION_GRANT_TYPE: "client_credentials"
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GATEWAY_SERVICE_PROVIDER: "keycloak"
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GATEWAY_SERVICE_SCOPE: "accounts:modify,cash:modify,transfer:modify"
  # Management endpoints
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,routes,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  # Gateway Discovery
  SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "false"
  SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID: "false"
  # Logging
  LOGGING_LEVEL_RU_YANDEX_PRACTICUM_GATEWAY: "{{ .Values.logging.level }}"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "{{ .Values.logging.gatewayLevel }}"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "{{ .Values.logging.securityLevel }}"
  # Micrometer Tracing (Zipkin) - B3 Multi Header for end-to-end tracing
  MANAGEMENT_TRACING_ENABLED: "{{ .Values.tracing.enabled | default "true" }}"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "{{ .Values.tracing.samplingProbability | default "1.0" }}"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: "{{ .Values.tracing.propagationType | default "B3,B3_MULTI" }}"
  MANAGEMENT_OBSERVATIONS_ENABLED: "true"
  {{- if and .Values.global .Values.global.zipkin .Values.global.zipkin.url }}
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "{{ .Values.global.zipkin.url }}/api/v2/spans"
  {{- else }}
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  {{- end }}
  # ELK Stack - Logstash configuration
  {{- if and .Values.global .Values.global.elk .Values.global.elk.logstash }}
  ELK_LOGSTASH_HOST: "{{ .Values.global.elk.logstash.host }}"
  ELK_LOGSTASH_PORT: "{{ .Values.global.elk.logstash.port }}"
  {{- else }}
  ELK_LOGSTASH_HOST: "logstash"
  ELK_LOGSTASH_PORT: "5000"
  {{- end }}
