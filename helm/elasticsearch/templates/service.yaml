apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9200
      protocol: TCP
      name: http
    - port: {{ .Values.service.transportPort }}
      targetPort: 9300
      protocol: TCP
      name: transport
  selector:
    app: {{ .Chart.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-headless
  labels:
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9200
      protocol: TCP
      name: http
    - port: {{ .Values.service.transportPort }}
      targetPort: 9300
      protocol: TCP
      name: transport
  selector:
    app: {{ .Chart.Name }}
