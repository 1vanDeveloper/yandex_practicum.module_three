apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-saved-objects
  labels:
    app: {{ .Chart.Name }}
data:
  saved-objects.ndjson: |
    {"id":"bank-logs","type":"index-pattern","attributes":{"title":"bank-logs-*","name":"Bank Logs","timeFieldName":"@timestamp","fieldAttrs":"{}","fieldFormatMap":"{}","fields":"[]","sourceFilters":"[]"}}
    {"id":"all-logs","type":"search","attributes":{"title":"All Logs","description":"Все логи сервисов","columns":["service","level","traceId","spanId","logger_name","message"],"sort":[["@timestamp","desc"]],"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"data-view:bank-logs\",\"query\":{\"query\":\"\",\"language\":\"kuery\"}}"},"references":[{"name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern","id":"bank-logs"}]}}
