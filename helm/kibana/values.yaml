# Kibana Helm Chart Values

image:
  repository: docker.elastic.co/kibana/kibana
  tag: "8.11.0"
  pullPolicy: IfNotPresent

# Elasticsearch connection
elasticsearch:
  hosts:
    - "http://elasticsearch:9200"

# Service configuration
service:
  type: NodePort
  port: 5601
  nodePort: 30561

# Resource limits
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1024Mi"

# Environment variables
env:
  - name: ELASTICSEARCH_HOSTS
    value: "http://elasticsearch:9200"
  - name: XPACK_SECURITY_ENABLED
    value: "false"
  - name: XPACK_SECURITY_ENROLLMENT_ENABLED
    value: "false"
  - name: SERVER_NAME
    value: "kibana"
  - name: SERVER_HOST
    value: "0.0.0.0"

# Kibana configuration for automatic Data Views
kibanaConfig:
  kibana.yml: |
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    xpack.security.enabled: false
    xpack.fleet.enabled: false
    xpack.encryptedSavedObjects.encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    xpack.reporting.encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    xpack.savedObjects.encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
