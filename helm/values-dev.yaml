# Dev окружение - для разработки и тестирования
# Не содержит реальных секретов - используется для локальной разработки

# Глобальные настройки
global:
  imageRegistry: ""
  imageTag: "latest"

  postgresql:
    host: "postgresql"
    port: 5432
    database: "bank"

  keycloak:
    url: "http://keycloak:8080"
    realm: "bank"

  kafka:
    enabled: true
    bootstrapServers: "bank-kafka-broker:9092"

# Accounts
accounts:
  replicaCount: 1
  image:
    repository: "bank-accounts"
    tag: "latest"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0

# Cash
cash:
  replicaCount: 1
  image:
    repository: "bank-cash"
    tag: "latest"
  resources:
    limits:
      cpu: "250m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0

# Transfer
transfer:
  replicaCount: 1
  image:
    repository: "bank-transfer"
    tag: "latest"
  resources:
    limits:
      cpu: "250m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0

# Notifications
notifications:
  replicaCount: 1
  databaseSchema: "notifications"
  image:
    repository: "bank-notifications"
    tag: "latest"
  logging:
    root: "DEBUG"
    kafka: "DEBUG"
    autoconfigure: "DEBUG"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0
    propagationType: "B3,B3_MULTI"

# Gateway
gateway:
  replicaCount: 1
  image:
    repository: "bank-gateway"
    tag: "latest"
  service:
    type: "ClusterIP"
  resources:
    limits:
      cpu: "300m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0
    propagationType: "B3"

# Frontend
frontend:
  replicaCount: 1
  image:
    repository: "bank-frontend"
    tag: "latest"
  service:
    type: "NodePort"
    nodePort: 30190
  ingress:
    enabled: false
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  # Трассировка (Micrometer + Zipkin)
  tracing:
    enabled: true
    samplingProbability: 1.0

# PostgreSQL
postgresql:
  replicaCount: 1
  image:
    repository: "postgres"
    tag: "14"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    enabled: false

# Keycloak
keycloak:
  replicaCount: 1
  image:
    repository: "quay.io/keycloak/keycloak"
    tag: "24.0.1"
  keycloak:
    adminUser: "admin"
    adminPassword: "admin"
    db: "dev-file"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Kafka (sir5kong/kafka chart - KRaft mode)
kafka:
  enabled: true
  image:
    repository: sir5kong/kafka
    tag: "v3.5.1"
    pullPolicy: IfNotPresent

  # Фиксированный cluster.id для KRaft режима (решает проблему DUPLICATE_BROKER_REGISTRATION)
  clusterId: "QxkqDKf5Tf6vXJZ3pLqLbw"

  controller:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: false
    resources:
      limits:
        cpu: "1000m"
        memory: "1024Mi"
      requests:
        cpu: "1000m"
        memory: "1024Mi"

  broker:
    combinedMode:
      enabled: true
    replicaCount: 1
    persistence:
      enabled: false
    heapOpts: "-Xms256m -Xmx256m"
    # Фиксированный node.id для broker (решает проблему DUPLICATE_BROKER_REGISTRATION)
    nodeId: 0
    # Init containers для форматирования хранилища KRaft
    initContainers:
      # Форматирование хранилища при отсутствии meta.properties
      - name: format-storage
        image: sir5kong/kafka:v3.4.0
        command:
          - sh
          - -c
          - |
            if [ ! -f /opt/kafka/data/meta.properties ]; then
              echo "Formatting Kafka storage with cluster.id: $KAFKA_CLUSTER_ID"
              /opt/kafka/bin/kafka-storage.sh format -t $KAFKA_CLUSTER_ID --ignore-formatted -c /opt/kafka/config/kraft/server.properties
              echo "Storage formatted successfully"
            else
              echo "Storage already formatted, skipping"
            fi
        env:
          - name: KAFKA_CLUSTER_ID
            valueFrom:
              secretKeyRef:
                name: bank-kafka-cluster-id
                key: clusterId
        volumeMounts:
          - name: data
            mountPath: /opt/kafka/data
    # Use BROKER listener (chart default) - clients connect via service DNS
    extraEnvs:
      - name: KAFKA_CFG_BROKER_HEARTBEAT_INTERVAL_MS
        value: "10000"
      - name: KAFKA_CFG_BROKER_SESSION_TIMEOUT_MS
        value: "60000"
    resources:
      limits:
        cpu: "1000m"
        memory: "1024Mi"
      requests:
        cpu: "1000m"
        memory: "1024Mi"
    # Fix readiness probe timeout (default 5s too small for Kafka startup)
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 60
      periodSeconds: 10
      failureThreshold: 10
    livenessProbe:
      initialDelaySeconds: 300
      timeoutSeconds: 10
      periodSeconds: 30
      failureThreshold: 5

  networkPolicy:
    enabled: true

# Zipkin (Distributed Tracing)
zipkin:
  enabled: true
  replicaCount: 1
  image:
    repository: "openzipkin/zipkin"
    tag: "2.24.3"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Prometheus (Metrics Collection)
prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: "prom/prometheus"
    tag: "v2.45.0"
  service:
    type: ClusterIP
    port: 9090
  externalService:
    enabled: true
    type: NodePort
    nodePort: 30090
  resources:
    limits:
      cpu: "500m"
      memory: "1024Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  persistence:
    enabled: false
  alertingRules:
    enabled: true
