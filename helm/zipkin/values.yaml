# Zipkin Helm Chart Values
replicaCount: 1

image:
  repository: openzipkin/zipkin
  tag: "2.24.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9411
  targetPort: 9411

resources:
  limits:
    cpu: "1000m"
    memory: "1024Mi"
  requests:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 9411
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: 9411
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

# Zipkin environment variables
env:
  JAVA_OPTS: "-Xmx1024m -Xms512m"
  STORAGE_TYPE: "mem"  # mem (default) or elasticsearch or mysql
  ES_HOSTS: ""  # Required if STORAGE_TYPE=elasticsearch
  MYSQL_HOST: ""  # Required if STORAGE_TYPE=mysql
  MYSQL_USER: ""
  MYSQL_PASS: ""

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
