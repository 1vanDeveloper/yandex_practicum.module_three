replicaCount: 1

image:
  repository: prom/prometheus
  tag: v2.45.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090
  nodePort: null

# Для доступа извне (если frontend снаружи кластера)
externalService:
  enabled: true
  type: NodePort
  nodePort: 30090

resources:
  limits:
    cpu: "1000m"
    memory: "2048Mi"
  requests:
    cpu: "500m"
    memory: "1024Mi"

persistence:
  enabled: true
  size: 10Gi
  storageClassName: null

# Конфигурация scrape для всех сервисов
scrapeConfigs:
  # Prometheus сам себя скрейпит
  prometheus:
    job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
  
  # Микросервисы banking платформы
  bankingServices:
    job_name: 'banking-services'
    scrape_interval: 15s
    metrics_path: '/actuator/prometheus'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default
    relabel_configs:
      # Скрейпим только поды с аннотацией prometheus.io/scrape=true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Используем кастомный порт если указан
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: ${1}
      # Добавляем метку сервиса
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service
      # Добавляем метку pod
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

# Alerting rules
alertingRules:
  enabled: true
  
# Alertmanager (опционально, пока без него)
alertmanager:
  enabled: false
