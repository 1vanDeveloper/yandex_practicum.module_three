apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Alertmanager configuration (если будет добавлен)
    {{- if .Values.alertmanager.enabled }}
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    {{- end }}

    # Правила алертов
    rule_files:
      {{- if .Values.alertingRules.enabled }}
      - /etc/prometheus/rules/*.yml
      {{- end }}

    # Конфигурация scrape jobs
    scrape_configs:
      # Prometheus сам себя скрейпит
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              service: 'prometheus'

      # Микросервисы banking платформы
      - job_name: 'banking-services'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          # Скрейпим только поды с аннотацией prometheus.io/scrape=true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Используем кастомный порт если указан
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
          # Добавляем метку сервиса
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
          # Добавляем метку pod
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # Добавляем метку namespace
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace

      # Frontend (NodePort сервис)
      - job_name: 'frontend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['frontend:8080']
        relabel_configs:
          - source_labels: [__address__]
            target_label: service
            replacement: 'frontend'
