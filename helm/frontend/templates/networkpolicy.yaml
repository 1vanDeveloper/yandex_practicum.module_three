apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frontend.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.ingress.enabled }}
    # Production: Allow traffic only from Ingress Controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.ingress.controllerNamespace | default "ingress-nginx" }}
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    # Development (NodePort): Allow from all sources
    # Note: NetworkPolicy cannot distinguish NodePort traffic from pod-to-pod
    - from: []
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    # Allow traffic from prometheus (for metrics scraping) - explicit rule
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow traffic to Gateway (for API calls)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic to Keycloak (for OAuth2)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8080
    # Allow traffic to Zipkin (for tracing)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zipkin
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 9411
    # Allow traffic to Logstash (for centralized logging)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logstash
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 5044
