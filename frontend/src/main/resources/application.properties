spring.application.name=frontend
server.port=8080
spring.cloud.compatibility-verifier.enabled=false
spring.cloud.consul.config.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# Virtual threads (Java 21+)
spring.threads.virtual.enabled=true

# Security (disabled for B3 tracing test)
spring.security.enabled=false

# OAuth2 Client для аутентификации пользователей через Keycloak (Authorization Code Flow)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bank}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URI:http://keycloak:8080/realms/bank/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/bank/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:http://keycloak:8080/realms/bank/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/bank/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.registration.frontend-client.client-id=${FRONTEND_CLIENT_ID:frontend-client}
spring.security.oauth2.client.registration.frontend-client.client-secret=${FRONTEND_CLIENT_SECRET:frontend-secret}
spring.security.oauth2.client.registration.frontend-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.frontend-client.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:8081/login/oauth2/code/frontend-client}
spring.security.oauth2.client.registration.frontend-client.scope=openid,profile,email
spring.security.oauth2.client.registration.frontend-client.provider=keycloak

# OAuth2 Resource Server для валидации JWT токенов
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bank}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/bank/protocol/openid-connect/certs}

# JWT secret для парсинга токенов (используется только для извлечения привилегий из JWT)
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeLongEnough}

# Gateway service URL
gateway.service.url=${GATEWAY_SERVICE_URL:http://gateway:8080}

# ==========================================
# Resilience4j Circuit Breaker Configuration
# ==========================================
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED

# Resilience4j Retry Configuration
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=1s
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

# Resilience4j Timelimiter Configuration
resilience4j.timelimiter.configs.default.timeoutDuration=5s

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.ru.yandex.practicum.mybankfront=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.ru.yandex.practicum.frontend=DEBUG

# ==========================================
# Micrometer Tracing (Zipkin) - Auto-configuration
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.observations.enabled=true

# Debug tracing
logging.level.zipkin=DEBUG
logging.level.ru.yandex.practicum.frontend=DEBUG

# Enable Spring Boot observation auto-configuration

# ==========================================
# Micrometer Tracing (Zipkin) + Prometheus Metrics
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus
management.observations.enabled=true
management.metrics.tags.application=${spring.application.name}

# Prometheus endpoint
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Zipkin tracing
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=B3,B3_MULTI
spring.mvc.observation.enabled=true
server.observation.enabled=true

# Reactor context propagation for async tracing
spring.reactor.context-propagation=auto
