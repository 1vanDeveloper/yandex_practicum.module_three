# ==========================================
# Logging
# ==========================================
logging.level.ru.yandex.practicum.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=INFO
logging.level.io.micrometer.tracing=DEBUG
logging.level.zipkin=DEBUG

# ==========================================
# Micrometer Tracing (Zipkin) - B3 Propagation
# ==========================================
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=B3,B3_MULTI
management.observations.enabled=true

# Observation for tracing
management.observation.key-values.application=gateway
spring.webflux.observation.enabled=true

# Reactor context propagation для автоматического проброса trace context
spring.reactor.context-propagation=auto

# Gateway HTTP client settings - в SCG 2025.x observation включён по умолчанию
spring.cloud.gateway.httpclient.add-proxy-headers=true

# Включаем стандартную маршрутизацию
spring.cloud.gateway.routing.enabled=true
spring.cloud.gateway.discovery.locator.enabled=false

# Явные маршруты на сервисы через k8s service names (SCG 2025.x использует server.webflux)
# Используем StripPrefix filter для удаления префикса сервиса
spring.cloud.gateway.server.webflux.routes[0].id=accounts
spring.cloud.gateway.server.webflux.routes[0].uri=http://accounts.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=cash
spring.cloud.gateway.server.webflux.routes[1].uri=http://cash.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cash/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=transfer
spring.cloud.gateway.server.webflux.routes[2].uri=http://transfer.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transfer/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=notifications
spring.cloud.gateway.server.webflux.routes[3].uri=http://notifications.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notifications/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=frontend
spring.cloud.gateway.server.webflux.routes[4].uri=http://frontend.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/frontend/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

# Auth routes (registration, login) -> accounts service
spring.cloud.gateway.server.webflux.routes[5].id=auth
spring.cloud.gateway.server.webflux.routes[5].uri=http://accounts.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/gateway/auth/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/gateway/auth/(?<segment>.*),/auth/${segment}

# Account routes -> accounts service
spring.cloud.gateway.server.webflux.routes[6].id=account
spring.cloud.gateway.server.webflux.routes[6].uri=http://accounts.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/gateway/account
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/gateway/account,/accounts/me

# Accounts list routes -> accounts service
spring.cloud.gateway.server.webflux.routes[7].id=accounts-list
spring.cloud.gateway.server.webflux.routes[7].uri=http://accounts.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/gateway/accounts
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/gateway/accounts,/accounts

# Cash routes -> cash service
spring.cloud.gateway.server.webflux.routes[8].id=cash-gateway
spring.cloud.gateway.server.webflux.routes[8].uri=http://cash.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/gateway/cash
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/gateway/cash,/cash

# Transfer routes -> transfer service
spring.cloud.gateway.server.webflux.routes[9].id=transfer-gateway
spring.cloud.gateway.server.webflux.routes[9].uri=http://transfer.default.svc.cluster.local:8080
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/gateway/transfer
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/gateway/transfer,/transfer
