# Test configuration for Notifications Service
spring.application.name=notifications-service-test

# Allow bean definition overriding in tests
spring.main.allow-bean-definition-overriding=true

# Disable Spring Cloud Config and Consul for tests
spring.config.import=optional:none
spring.cloud.config.enabled=false
spring.cloud.consul.enabled=false
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.enabled=false

# Disable Flyway for tests (H2 handles schema via spring.sql.init)
spring.flyway.enabled=false

# Disable security for tests
spring.security.enabled=false

# Server configuration
server.port=0

# Disable OpenAPI for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# H2 in-memory database for unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS notifications
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=notifications

# Initialize schema from SQL script
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Kafka configuration for tests with Embedded Kafka
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.group-id=notifications-test
spring.kafka.consumer.auto-offset-reset=earliest

# Disable Kafka listener auto-startup
spring.kafka.listener.auto-startup=false

# Kafka topic configuration (test)
kafka.topic.notifications=notifications.events
kafka.topic.notifications.partitions=1
kafka.topic.notifications.replicas=1

# Logging
logging.level.ru.yandex.practicum.notifications=DEBUG
